name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Publish-time gate, shared with every other public katalalab repository. Two
  # sibling repos shipped the operator's home paths while their own checks reported
  # ok, so this runs from one canonical source rather than a per-repo copy.
  no-instance-data:
    uses: katalalab/.github/.github/workflows/instance-data-gate.yml@main

  verify-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run verify:local
      - name: Host hook smoke
        run: node examples/host-hook-smoke.mjs
      - name: OpenClaw tool adapter smoke
        run: node examples/openclaw-tool-adapter-smoke.mjs
      - name: Host decision matrix
        run: node examples/host-decision-matrix.mjs
      - name: Blocked write demo
        run: node examples/blocked-write-demo.mjs
      - name: Think-host CLI smoke
        run: node examples/think-host-cli-smoke.mjs
      - name: Agent turn preflight
        run: node examples/agent-turn-preflight.mjs
      - name: Trust eval v1
        run: node scripts/run-trust-eval.mjs
